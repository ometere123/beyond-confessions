[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "beyond-confessions"
version = "0.1.0"
description = "Reproducible measurement foundation for multi-agent collusion research."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "openai>=2.0,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "matplotlib>=3.9,<4",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
beyond-confessions = "beyond_confessions.cli:main"

[dependency-groups]
dev = [
  "matplotlib>=3.9,<4",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
